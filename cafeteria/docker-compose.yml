services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  core-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  users-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-service:
    build:
      context: ../../../Downloads/solution/services/core_service
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@core-db:5432/core_db
      USERS_BASE_URL: http://users-service:8080
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      core-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  users-service:
    build:
      context: ../../../Downloads/solution/services/users_service
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@users-db:5432/users_db
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  notification-service:
    build:
      context: ./services/notification_service
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@notification-db:5432/notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    build:
      context: ../../../Downloads/solution/services/gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CORE_SERVICE_URL: http://core-service:8080
      USERS_SERVICE_URL: http://users-service:8080
    depends_on:
      core-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
